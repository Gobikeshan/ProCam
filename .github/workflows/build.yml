name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Unzip project
        run: |
          mkdir work
          ZIP=$(find . -name "*.zip" -not -path "./work/*" | head -n 1)
          echo "Using: $ZIP"
          unzip -q "$ZIP" -d work
      - name: Create debug keystore
        working-directory: work
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build debug APK
        working-directory: work
        run: gradle assembleDebug --no-daemon
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" \
            work/app/build/outputs/apk/debug/app-debug.apk \
            --title "ProCam APK ${{ github.run_number }}" \
            --notes "Debug build"
